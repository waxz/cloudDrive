name = "cf-drive"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[alias]
"@aws-sdk/xml-builder" = "./shims/xml-builder.js"

# Admin settings, users and usage counters.
[[kv_namespaces]]
binding = "CONFIG"

# Optional: an R2 bucket bound directly to the Worker. Shows up as the
# "r2-binding" backend type in the admin panel (no API keys needed).
[[r2_buckets]]
binding = "BUCKET"

# Secrets (set with `wrangler secret put`):
#   ADMIN_PASSWORD  password for the /admin panel
